[project]
name = "jeoksn"
version = "0.1.0"
description = "원가분석사 기준 원가계산 엔진"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
jeoksn = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
